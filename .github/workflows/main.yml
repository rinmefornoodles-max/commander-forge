name: Deploy The Commander Forge

on:
  push:
    branches: [main, abilities-6.15.0]
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref == 'refs/heads/main' && 'github-pages' || '' }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Commander Forge 6.15 gameplay bundle
        run: python build_release_6_15.py

      - name: Run Commander Forge regression tests
        run: npm test

      - name: Build same-origin official precon catalog
        run: python build_precons.py

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload website files
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
