<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10120f" />
  <meta name="description" content="A digital Commander practice table with drag-and-drop cards, deck validation, game tracking, and a strategy coach." />
  <title>The Commander Forge</title>
  <link rel="icon" href="./forge-mark.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./commander-forge-5.15.0.css" />
</head>
<body>
  <div id="app" aria-live="polite"><div class="boot-loading">Loading The Commander Forge…</div></div>
  <div id="toast-root" aria-live="assertive"></div>
  <script>
    (() => {
      const app=document.getElementById('app');
      window.__forgeStarted=false;
      const show=(message)=>{app.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#071015;color:#eef3ee;font-family:system-ui,sans-serif"><div style="max-width:760px;background:#101c22;border:1px solid #a85151;border-radius:16px;padding:22px"><h1 style="margin-top:0">The Commander Forge could not start</h1><p>The single app bundle did not load. Make sure <strong>commander-forge-5.15.0.js</strong> was uploaded beside index.html.</p><pre style="white-space:pre-wrap;overflow:auto;background:#071015;padding:12px;border-radius:10px;color:#ffb4b4">${String(message||'Unknown startup error')}</pre><button onclick="location.reload()" style="padding:10px 16px;border-radius:10px;border:0;cursor:pointer">Reload</button></div></div>`};
      window.__forgeBootError=show;
      window.addEventListener('error',(e)=>show(e.error?.stack||e.message));
      window.addEventListener('unhandledrejection',(e)=>show(e.reason?.stack||e.reason));
      if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});
      if('caches' in window) caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).catch(()=>{});
      setTimeout(()=>{if(!document.querySelector('.app-header')&&!document.querySelector('.setup-modal')) show('The app file loaded too slowly or did not execute.');},10000);
    })();
  </script>
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js" integrity="sha512-XEKeWX+mI3Ov+tg2evDlVQFzVOIp4T8J3cNcCEPaEUGpxJV3eZaN8rHuvnFPvQpGJBHPmrozJDMpm2xcDvtmyQ==" crossorigin="anonymous"></script>
  <script defer src="./commander-forge-5.15.0.js" onerror="window.__forgeBootError('HTTP error while loading commander-forge-5.15.0.js')"></script>
</body>
</html>
